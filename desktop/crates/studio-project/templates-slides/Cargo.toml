[package]
name = "studio-video"
version = "0.1.0"
edition = "2024"
default-run = "studio-video"

[workspace]

[dependencies]
fframes = { version = "=1.3.0", features = ["cli", "compile-time-svgtree", "styles"] }
fframes-studio-runtime = { version = "=0.2.0" }
fframes-studio-protocol = { version = "=0.2.0" }
fframes-kit = { version = "=0.3.0", features = ["studio"] }
fframes-studio-kit = { version = "=0.2.0" }
