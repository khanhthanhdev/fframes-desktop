[package]
name = "studio-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Component kit, editor layout and panels for fframes studio"

[lib]
path = "src/lib.rs"

[dependencies]
gpui = { workspace = true }
studio-bootstrap = { workspace = true }
studio-markdown = { workspace = true }
studio-engine = { workspace = true }
studio-harness = { workspace = true }
studio-project = { workspace = true }
studio-proto = { workspace = true }
studio-sdk = { workspace = true }
studio-theme = { workspace = true }
async-channel = "2"
fframes-studio-protocol = { workspace = true }
image = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
similar = "2"
smallvec = { workspace = true }
thiserror = { workspace = true }
unicode-segmentation = "1"
unicode-width = "0.2"
tree-sitter = { version = "=0.26.11", optional = true }
tree-sitter-highlight = { version = "=0.26.11", optional = true }
tree-sitter-rust = { version = "=0.24.2", optional = true }
tree-sitter-json = { version = "=0.24.8", optional = true }
tree-sitter-bash = { version = "=0.25.1", optional = true }
tree-sitter-toml-ng = { version = "=0.7.0", optional = true }
tree-sitter-md = { version = "=0.5.3", optional = true }

[features]
default = ["syntax-grammars"]
# The tree-sitter grammars behind agent code-block highlighting. Off, `agent::syntax` returns no spans.
syntax-grammars = [
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-json",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-md",
]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
