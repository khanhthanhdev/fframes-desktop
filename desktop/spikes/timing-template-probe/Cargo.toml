[package]
name = "studio-video"
version = "0.1.0"
edition = "2024"
default-run = "studio-video"

[workspace]

[dependencies]
fframes = { version = "=1.2.0", features = ["cli", "compile-time-svgtree", "styles"] }
fframes-studio-runtime = { version = "=0.1.0" }
fframes-studio-protocol = { version = "=0.1.0" }
serde_json = "1"

# Spike only: build the template project against the timing spike branch.
[patch.crates-io]
fframes = { path = "C:/Users/Administrator/fframes-spike-timing/fframes" }
fframes-studio-runtime = { path = "C:/Users/Administrator/fframes-spike-timing/fframes-studio-runtime" }
fframes-studio-protocol = { path = "C:/Users/Administrator/fframes-spike-timing/fframes-studio-protocol" }
