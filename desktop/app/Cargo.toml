[package]
name = "fframes-studio"
version = "0.2.9"
edition = "2024"
license = "MIT"
description = "Minimal native desktop studio application for fframes"
default-run = "fframes-studio"
[lib]
path = "src/lib.rs"

[build-dependencies]
embed-resource = "3.0.11"

[[bin]]
name = "fframes-studio"
path = "src/main.rs"

[[bin]]
name = "studio-tools"
path = "src/bin/studio_tools.rs"

[[bin]]
name = "studio-mcp"
path = "src/bin/studio_mcp.rs"


[dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
studio-engine = { workspace = true }
studio-ui = { workspace = true }
studio-theme = { workspace = true }
studio-bootstrap = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[dev-dependencies]
studio-test-support = { path = "../crates/studio-test-support" }
gpui = { workspace = true, features = ["test-support"] }
studio-bootstrap = { workspace = true, features = ["fault-injection"] }
studio-project = { workspace = true }
studio-presets = { workspace = true }
studio-sdk = { workspace = true }
studio-harness = { workspace = true }
fframes-studio-protocol = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
cpal = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "windows")'.dev-dependencies]
# Graphics_Gdi, Storage_Xps, UI_WindowsAndMessaging and raw-window-handle: the gallery's
# `--capture` mode (examples/ui_gallery/capture.rs).
windows-sys = { version = "0.59", features = ["Win32_Security", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"
