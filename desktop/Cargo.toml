[workspace]
resolver = "2"
members = [
    "app",
    "crates/studio-project",
    "crates/studio-presets",
    "crates/studio-engine",
    "crates/studio-bootstrap",
    "crates/studio-sdk",
    "crates/studio-agent-spike",
]

[workspace.dependencies]
studio-project = { path = "crates/studio-project" }
studio-engine = { path = "crates/studio-engine" }
studio-presets = { path = "crates/studio-presets" }
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
studio-bootstrap = { path = "crates/studio-bootstrap" }
fframes-studio-protocol = { path = "../fframes-studio-protocol" }
studio-sdk = { path = "crates/studio-sdk" }
studio-agent-spike = { path = "crates/studio-agent-spike" }
sha2 = "0.10"
tar = "0.4"
flate2 = "1.0"
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1.16"
cpal = "=0.18.2"
agent-client-protocol = "=2.2.0"
futures = "0.3"

[workspace.dependencies.gpui]
git = "https://github.com/zed-industries/zed.git"
rev = "1a84d5d92bd7d6c1cabb116062650af545783fe9"

[workspace.dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed.git"
rev = "1a84d5d92bd7d6c1cabb116062650af545783fe9"
