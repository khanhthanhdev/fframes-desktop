<svg xmlns="http://www.w3.org/2000/svg" id="svg1" viewBox="0 0 200 200"><title>Semi-transparent map</title><desc>The map must be read with non-premultiplied color values, so a half-transparent white map moves pixels like an opaque one: scale * 0.5 = 10 px up and left. The blue rect should match the dashed red outline.</desc><filter id="filter1" width="200" height="200" x="0" y="0" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feFlood id="feFlood1" flood-color="#fff" flood-opacity=".5" result="map"/><feDisplacementMap id="feDisplacementMap1" in="SourceGraphic" in2="map" scale="20" xChannelSelector="R" yChannelSelector="G"/></filter><rect id="rect1" width="100" height="100" x="50" y="50" fill="#00f" filter="url(#filter1)"/><rect id="expected" width="100" height="100" x="40" y="40" fill="none" stroke="red" stroke-dasharray="4"/><rect id="frame" width="198" height="198" x="1" y="1" fill="none" stroke="#000"/></svg>