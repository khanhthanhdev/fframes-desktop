<svg xmlns="http://www.w3.org/2000/svg" id="svg1" viewBox="0 0 200 200"><title>Uniform map</title><desc>The map is a solid #c0c0c0 (R = G = 0.753), so every pixel moves by scale * (0.753 - 0.5) = 20 * 0.253, about 5 px up and left. The blue rect should match the dashed red outline.</desc><filter id="filter1" width="200" height="200" x="0" y="0" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feFlood id="feFlood1" flood-color="silver" result="map"/><feDisplacementMap id="feDisplacementMap1" in="SourceGraphic" in2="map" scale="20" xChannelSelector="R" yChannelSelector="G"/></filter><rect id="rect1" width="100" height="100" x="50" y="50" fill="#00f" filter="url(#filter1)"/><rect id="expected" width="100" height="100" x="45" y="45" fill="none" stroke="red" stroke-dasharray="4"/><rect id="frame" width="198" height="198" x="1" y="1" fill="none" stroke="#000"/></svg>