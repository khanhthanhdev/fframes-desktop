[files]
# Keep the upstream minified player unchanged; its identifiers are not prose.
# The Lottie files are third-party animations: their layer names are not prose either.
# Recorded agent wire captures (*.jsonl) are full of random tool ids.
# Reports written partly in Vietnamese ("thay", "ba") and recorded diffs are not English prose.
extend-exclude = ["plans/reports/booth-script-261022-0727-fframes-studio-career-day.md", "plans/reports/experiment-261025-1640-typst-vs-miktex.md", "plans/reports/experiment-261025-1803-typst-formula-parts.md", "plans/reports/*.patch", "*.snapshot.txt", "sessions.json", "package-lock.json", "landing/the-why/vendor/hls.min.js", "landing/vendor/hls.min.js", "examples/lottie/media/*.json", "*.jsonl"]
[default]
# Git commit hashes in plans and reports (`cb5d0daa`)
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[default.extend-words]
# Zed's screen-capture crate (`zed-scap`)
scap = "scap"
hd = "hd"
# "PNGs" is split into "PN" + "Gs"
PN = "PN"
seeked = "seeked"
# Windows system library (Secur32.dll) in recorded import tables
Secur = "Secur"
# graphics terms of fframes_three_d: PBR metalness (three.js), level of detail, integer y next to ix
metalness = "metalness"
lod = "lod"
iy = "iy"
# Codex thread ids (`thr-…`)
thr = "thr"
# "café" split at the accent in text-input tests
caf = "caf"
# tasklist's `/FO CSV` flag
FO = "FO"
# Claude CLI's `ede_diagnostic` error tag in wire-shape reports
ede = "ede"
# Crate and example names in plans: `flate2`, chematic's `threed`, the `convnet` ml example
flate = "flate"
threed = "threed"
convnet = "convnet"
