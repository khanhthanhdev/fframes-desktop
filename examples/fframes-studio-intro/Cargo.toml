[package]
name = "fframes-studio-intro"
version = "1.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { workspace = true, features = ["compile-time-svgtree", "cli"] }
serde_json = "1.0"
fframes-kit = "=0.2.0"
fframes-components = { version = "0.1.2", default-features = false, features = ["prompt-zoom", "strike-through", "tracking-in", "typing-code-block", "word-flip"] }

# Metal on macOS, Vulkan everywhere else
[target.'cfg(target_os = "macos")'.dependencies]
fframes_skia_renderer = { workspace = true, features = ["metal"] }
fframes_native_player = { workspace = true, features = ["metal", "audio"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
fframes_skia_renderer = { workspace = true, features = ["vulkan"] }
fframes_native_player = { workspace = true, features = ["vulkan", "audio"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { workspace = true, features = ["h264", "libav-agree-gpl"] }

[target.'cfg(not(any(target_arch = "wasm32", windows)))'.dependencies]
fframes = { workspace = true, features = ["build-portable"] }

[lib]
name = "fframes_studio_intro"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "fframes-studio-intro"
path = "src/main.rs"

[[bin]]
name = "fframes-studio-intro-portrait"
path = "src/portrait_main.rs"

[[bin]]
name = "fframes-studio-intro-short"
path = "src/short_main.rs"

[lints]
workspace = true
