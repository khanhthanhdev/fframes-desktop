[package]
name = "fframes-studio-kit"
# Released with fframes-studio-runtime: Studio binds both to its SDK by this version.
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "fframes Studio's props store for fframes-kit components: props.json, editor identities and the props panel hooks"

# fframes-kit builds against crates.io fframes; the root workspace's `[patch.crates-io]`
# replaces it with this repository's, so the kit and Studio share one fframes.
[dependencies]
fframes = { path = "../fframes", version = "1.3.0", default-features = false }
fframes-kit = { version = "=0.3.0", features = ["studio"] }
fframes-studio-protocol = { path = "../fframes-studio-protocol", version = "0.2.0" }
fframes-studio-runtime = { path = "../fframes-studio-runtime", version = "0.2.0", default-features = false }

[dev-dependencies]
fframes = { path = "../fframes", version = "1.3.0", features = ["compile-time-svgtree", "styles"] }
serde_json = "1.0"
