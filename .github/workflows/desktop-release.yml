name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag: v + the version in desktop/app/Cargo.toml (e.g. v0.1.2)"
        required: true
      run_id:
        description: "Run ID to attach existing artifacts from (leave empty to build fresh)"
        required: false
        default: ""
      draft:
        description: "Create draft release"
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false
      preview_release:
        description: "Publish an unsigned preview release (installer, ZIPs, winget/Scoop manifests, install.ps1); tag pushes do this automatically"
        type: boolean
        default: false
      consumer_release:
        description: "Publish the release policy's eligible targets (needs a green full self-hosted run and a green Desktop CI run on main at the tag commit)"
        type: boolean
        default: false
      dry_run:
        description: "Publish nothing; prepare preview release files, or run the consumer release gate and package verification"
        type: boolean
        default: false
      sign_artifacts:
        description: "Sign the Windows binaries and installer for a release build (requires configured signing secrets)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # fframes Studio ships for Windows only.
  matrix:
    name: Build Native (${{ matrix.target }})
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.run_id == '' || inputs.run_id == null))
    strategy:
      matrix:
        include:
          - runner: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Windows builds on the self-hosted runner, set up like its validation job: the toolchain,
      # FFmpeg and the warm target directory stay on the machine between runs.
      - uses: ./.github/actions/desktop-windows-self-hosted-setup
      - name: Check the release tag matches the app version
        if: github.event_name == 'push' || inputs.preview_release == true || inputs.consumer_release == true
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -m1 '^version = ' desktop/app/Cargo.toml | cut -d'"' -f2)"
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match desktop/app/Cargo.toml version $version; bump the version before tagging." >&2
            exit 1
          fi
          # Fail before the long native builds rather than at publication.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published bytes are immutable. Bump the version for a new release." >&2
            exit 1
          fi
      # Tag-triggered builds are deliberately unsigned; signing is opt-in on manual dispatches.
      - name: Check Windows signing credentials before building
        if: github.event_name == 'workflow_dispatch' && (inputs.sign_artifacts == true || inputs.consumer_release == true)
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          required=(WINDOWS_CODESIGN_PFX_BASE64 WINDOWS_CODESIGN_PFX_PASSWORD)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required signing secret: $name" >&2
              exit 1
            fi
          done
      - name: Assert native architecture
        run: |
          python -c 'import subprocess; assert "host: ${{ matrix.target }}" in subprocess.check_output(["rustc", "-vV"], text=True)'
      - name: Focused tests and lint
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --all --check
          cargo test --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-harness -p studio-proto -p studio-theme -p studio-ui -p fframes-studio
          cargo clippy --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-harness -p studio-proto -p studio-theme -p studio-ui -p fframes-studio --all-targets -- -D warnings
          cargo test --locked -p fframes-studio-protocol -p fframes-studio-runtime
          python desktop/scripts/test-packaging.py
          python desktop/scripts/test-release-gate.py
      - name: Build and render annotated worker
        run: |
          cargo build --release --manifest-path desktop/fixtures/annotated-video-overlay/Cargo.toml
          cd desktop/fixtures/annotated-video-overlay
          cargo run --release -- frame 0 -o "$RUNNER_TEMP/worker-frame"
      - name: Real worker frame, anchor, crash and restart
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test worker_roundtrip -- --ignored
      - name: Assemble and verify native offline SDK
        run: python desktop/scripts/assemble-phase-zero-sdk.py --out "$RUNNER_TEMP/studio-sdk"
      - name: Install SDK and launch managed worker
        run: SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" cargo test --locked --manifest-path desktop/Cargo.toml -p studio-engine --test managed_worker -- --ignored
      - name: Package native app and SDK artifact
        run: python desktop/scripts/package-phase-zero.py --out "$RUNNER_TEMP/fframes-studio-${{ matrix.target }}" --sdk-bundle "$RUNNER_TEMP/studio-sdk"
      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.0-x64.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne "0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F") {
            throw "Inno Setup download checksum mismatch"
          }
          # Portable mode: unpacked into the runner temp directory, no uninstall entry.
          $directory = Join-Path $env:RUNNER_TEMP "inno-setup"
          $process = Start-Process $installer -ArgumentList "/CURRENTUSER", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/PORTABLE=1", "/NOICONS", "/DIR=$directory" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed (exit $($process.ExitCode))" }
          "INNO_SETUP_COMPILER=$(Join-Path $directory 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Sign Windows executables and FFmpeg DLLs, then build the signed installer
        if: github.event_name == 'workflow_dispatch' && (inputs.sign_artifacts == true || inputs.consumer_release == true)
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        shell: pwsh
        run: ./desktop/scripts/sign-windows-package.ps1 -PackagePath "$env:RUNNER_TEMP/fframes-studio-${{ matrix.target }}" -InstallerPath "$env:RUNNER_TEMP/fframes-studio-${{ matrix.target }}-setup.exe"
      - name: Package unsigned Windows installer candidate
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.sign_artifacts == true || inputs.consumer_release == true)) }}
        run: |
          python desktop/scripts/package-windows-installer.py \
            --source "$RUNNER_TEMP/fframes-studio-${{ matrix.target }}" \
            --out "$RUNNER_TEMP/fframes-studio-${{ matrix.target }}-setup.exe"
      - name: Windows installer tests
        run: python desktop/scripts/test-packaging.py -k windows_installer
      - name: Attest native app package provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/fframes-studio-${{ matrix.target }}.zip
      - name: Attest Windows installer candidate provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/fframes-studio-${{ matrix.target }}-setup.exe
      - name: Retain Windows installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: studio-windows-installer-${{ matrix.target }}
          path: ${{ runner.temp }}/fframes-studio-${{ matrix.target }}-setup.exe
          if-no-files-found: error
          retention-days: 14
          # Already compressed: storing skips minutes of re-zipping.
          compression-level: 0
      - name: Retain artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.target }}
          path: ${{ runner.temp }}/fframes-studio-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Unsigned builds for early users. The consumer release below is gated by release-gate.py.
  publish-preview:
    name: Publish Unsigned Preview
    needs: [matrix]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' || (inputs.preview_release == true && inputs.consumer_release != true)) &&
      (needs.matrix.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.run_id != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve tag and source commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$RUN_ID" ]; then
            source_commit="$(gh run view "$RUN_ID" -R "$REPOSITORY" --json headSha -q .headSha)"
          else
            source_commit="$GITHUB_SHA"
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tag_commit="$(git rev-parse "$TAG^{commit}")"
            if [ "$tag_commit" != "$source_commit" ]; then
              echo "Tag $TAG points at $tag_commit, but the artifacts were built from $source_commit." >&2
              exit 1
            fi
          fi
          if gh release view "$TAG" -R "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published bytes are immutable. Bump the version for a new release." >&2
            exit 1
          fi
          git checkout --quiet "$source_commit"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
      - name: Fetch built packages
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh run download "${RUN_ID:-$GITHUB_RUN_ID}" -R "$REPOSITORY" -D raw-artifacts
          mkdir dist
          find raw-artifacts -type f \( -name 'fframes-studio-*.zip' -o -name 'fframes-studio-*-setup.exe' \) -exec cp {} dist/ \;
          ls -lh dist
      - name: Generate manifests, install script, checksums and notes
        run: python3 desktop/scripts/prepare-github-release.py --tag "$RELEASE_TAG" --dist dist --repository "$GITHUB_REPOSITORY"
      - name: Retain prepared preview files for dry-run review
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: studio-preview-dry-run
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          extra_args=()
          # Not a prerelease by default: releases/latest/download (install.ps1, Scoop) only follows full releases.
          if [ "$INPUT_PRERELEASE" = "true" ]; then extra_args+=("--prerelease"); fi
          if [ "$INPUT_DRAFT" = "true" ]; then extra_args+=("--draft"); fi
          find dist -maxdepth 1 -type f ! -name release-notes.md -print0 | sort -z | xargs -0 \
            gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" \
              --title "fframes Studio $RELEASE_TAG (unsigned preview)" \
              --notes-file dist/release-notes.md "${extra_args[@]}"
          echo "Published: $(gh release view "$RELEASE_TAG" --json url -q .url)"
      - name: Preview dry run summary
        if: inputs.dry_run == true
        run: echo "Preview dry run prepared $RELEASE_TAG from $SOURCE_COMMIT; nothing was published."

  publish:
    name: Publish Release
    needs: [matrix]
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_release == true && always() && !cancelled() && (needs.matrix.result == 'success' || needs.matrix.result == 'failure' || (inputs.run_id != '' && inputs.run_id != null))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: A semantic version tag is required" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Validate release eligibility and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          # The successful runs of a workflow at the tag commit, as `gh run view --json` objects.
          runs() {
            gh run list -R "$REPOSITORY" --workflow "$1" --commit "$tag_commit" --status success --limit 50 \
                --json databaseId -q '.[].databaseId' |
              while read -r id; do
                gh run view "$id" -R "$REPOSITORY" --json workflowName,headSha,headBranch,conclusion,jobs
              done | jq -s .
          }
          runs desktop-self-hosted.yml > "$RUNNER_TEMP/self-hosted-runs.json"
          runs desktop.yml > "$RUNNER_TEMP/desktop-runs.json"
          eligible_targets="$(python3 desktop/scripts/release-gate.py \
            --policy desktop/packaging/release-policy.json \
            --tag-commit "$tag_commit" \
            --self-hosted-runs "$RUNNER_TEMP/self-hosted-runs.json" \
            --desktop-runs "$RUNNER_TEMP/desktop-runs.json")"
          if [ -n "$RUN_ID" ]; then
            run_commit="$(gh run view "$RUN_ID" -R "$REPOSITORY" --json headSha -q .headSha)"
            if [ "$run_commit" != "$tag_commit" ]; then
              echo "Reused artifact run does not match the release tag commit." >&2
              exit 1
            fi
          elif [ "$GITHUB_SHA" != "$tag_commit" ]; then
            echo "Fresh native build commit does not match the release tag." >&2
            exit 1
          fi
          echo "ELIGIBLE_TARGETS=$eligible_targets" >> "$GITHUB_ENV"

      - name: Fetch release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p raw-artifacts dist
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$RUN_ID" ]; then
            echo "Downloading artifacts from run $RUN_ID..."
            gh run download "$RUN_ID" -R "$REPOSITORY" -D raw-artifacts
          else
            echo "Downloading artifacts from current run..."
            gh run download "$GITHUB_RUN_ID" -R "$REPOSITORY" -D raw-artifacts
          fi

          echo "Extracted files in raw-artifacts:"
          find raw-artifacts -type f

          for target in $ELIGIBLE_TARGETS; do
            expected="fframes-studio-${target}.zip"
            candidate="$(find raw-artifacts -type f -name "$expected" -print -quit)"
            if [ -z "$candidate" ]; then
              echo "Missing native candidate package for eligible target $target" >&2
              exit 1
            fi
            cp "$candidate" "dist/$expected"
            python3 desktop/scripts/verify-package.py --policy desktop/packaging/release-policy.json "$target" "dist/$expected"
          done
          ls -lh dist/

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum fframes-studio-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Release Notes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          labels = {
              "x86_64-pc-windows-msvc": "Windows x64",
          }
          packages = sorted(Path("dist").glob("fframes-studio-*.zip"))
          lines = [f"# fframes Studio {os.environ['RELEASE_TAG']}", "", "Native desktop video development studio for fframes.", "", "## Downloads", ""]
          for package in packages:
              target = package.name.removeprefix("fframes-studio-").removesuffix(".zip")
              lines.append(f"- {labels[target]}: `{package.name}`")
          lines.extend(["", "## SHA-256", "", "```text", Path("dist/SHA256SUMS.txt").read_text().rstrip(), "```", ""])
          Path("release-notes.md").write_text("\n".join(lines))
          PY
          cat release-notes.md

      - name: Publish GitHub Release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          extra_args=()
          if [ "$INPUT_PRERELEASE" = "true" ]; then
            extra_args+=("--prerelease")
          fi
          if [ "$INPUT_DRAFT" = "true" ]; then
            extra_args+=("--draft")
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; published bytes are immutable." >&2
            exit 1
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" dist/* \
              --title "fframes Studio $RELEASE_TAG" \
              --notes-file release-notes.md \
              "${extra_args[@]}"
          fi
          echo "Release successfully published: $(gh release view "$RELEASE_TAG" --json url -q .url)"

      - name: Dry run summary
        if: inputs.dry_run == true
        run: |
          echo "Dry run: $RELEASE_TAG would publish $ELIGIBLE_TARGETS; nothing was published."
