name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      run_id:
        description: "Run ID to attach existing artifacts from (leave empty to build fresh)"
        required: false
        default: ""
      draft:
        description: "Create draft release"
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false
      consumer_release:
        description: "Publish only targets proven eligible by the M7 ledger"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Build Native (${{ matrix.runner }})
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.run_id == '' || inputs.run_id == null))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Set native build directory
        run: |
          if command -v cygpath >/dev/null 2>&1; then
            echo "CARGO_TARGET_DIR=$(cygpath -m "$RUNNER_TEMP/studio-native")" >> "$GITHUB_ENV"
          else
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/studio-native" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: Assert native architecture
        run: |
          python3 -c 'import subprocess; assert "host: ${{ matrix.target }}" in subprocess.check_output(["rustc", "-vV"], text=True)'
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config dpkg-dev libssl-dev libfontconfig1-dev libasound2-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libzstd-dev nasm
          llvm_lib="$(find /usr/lib -name "libclang.so" 2>/dev/null | head -n1)"
          if [ -n "$llvm_lib" ]; then
            echo "LIBCLANG_PATH=$(dirname "$llvm_lib")" >> "$GITHUB_ENV"
          fi
      - name: macOS native prerequisites
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install nasm || true
          xcode_dir="$(xcode-select -p 2>/dev/null || echo '/Applications/Xcode.app/Contents/Developer')"
          if [ -d "$xcode_dir/Toolchains/XcodeDefault.xctoolchain/usr/lib" ]; then
            echo "LIBCLANG_PATH=$xcode_dir/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
          fi
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure Windows MSVC toolchain precedence
        if: runner.os == 'Windows'
        run: |
          rm -f /usr/bin/link.exe /usr/bin/link
          which link
      - name: Build pinned native FFmpeg install
        if: runner.os != 'Windows'
        run: |
          python3 desktop/scripts/build-native-ffmpeg.py --source "$RUNNER_TEMP/ffmpeg-source" --out "$RUNNER_TEMP/ffmpeg-native"
          echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg-native" >> "$GITHUB_ENV"
      - name: Windows FFmpeg build dependency
        if: runner.os == 'Windows'
        run: |
          distribution=ffmpeg-n9.0.2-22-g46d8f462ee-win64-gpl-shared-9.0
          release=autobuild-2026-10-07-13-07
          expected_sha256=124799f0643a75eb84a64a589f1abac8f81732587942f3f34458688036153f0d
          curl -fL "https://github.com/BtbN/FFmpeg-Builds/releases/download/$release/$distribution.zip" -o "$RUNNER_TEMP/ffmpeg.zip"
          echo "$expected_sha256  $RUNNER_TEMP/ffmpeg.zip" | sha256sum --check --status
          7z x "$RUNNER_TEMP/ffmpeg.zip" -o"$RUNNER_TEMP/ffmpeg"
          ffmpeg_dir="$(cygpath -w "$RUNNER_TEMP/ffmpeg/$distribution")"
          echo "FFMPEG_DIR=$ffmpeg_dir" >> "$GITHUB_ENV"
          echo "$ffmpeg_dir\bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
      - name: Focused tests and lint
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --all --check
          cargo test --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-agent-spike -p fframes-studio
          cargo clippy --locked --manifest-path desktop/Cargo.toml -p studio-project -p studio-engine -p studio-bootstrap -p studio-sdk -p studio-agent-spike -p fframes-studio --all-targets -- -D warnings
          cargo test --locked -p fframes-studio-protocol -p fframes-studio-runtime
          python3 desktop/scripts/test-packaging.py
          python3 desktop/scripts/validate-qualification.py desktop/qualification/m0-results.json
          python3 desktop/scripts/validate-qualification.py desktop/qualification/m2-results.json
      - name: Build and render annotated worker
        run: |
          cargo build --release --manifest-path desktop/fixtures/annotated-video-overlay/Cargo.toml
          cd desktop/fixtures/annotated-video-overlay
          cargo run --release -- frame 0 -o "$RUNNER_TEMP/worker-frame"
      - name: Real worker frame, anchor, crash and restart
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test worker_roundtrip -- --ignored
      - name: Assemble and verify native offline SDK
        run: python3 desktop/scripts/assemble-phase-zero-sdk.py --out "$RUNNER_TEMP/studio-sdk"
      - name: Install SDK and launch managed worker
        run: SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test managed_worker -- --ignored
      - name: Package native app and SDK artifact
        run: python3 desktop/scripts/package-phase-zero.py --out "$RUNNER_TEMP/fframes-studio-${{ matrix.target }}" --sdk-bundle "$RUNNER_TEMP/studio-sdk"
      - name: Package unsigned Linux Debian candidate
        if: runner.os == 'Linux'
        env:
          MAINTAINER: "fframes Studio Maintainers <${{ github.repository_owner }}@users.noreply.github.com>"
        run: |
          python3 desktop/scripts/package-linux-deb.py \
            --source "$RUNNER_TEMP/fframes-studio-${{ matrix.target }}" \
            --out "$RUNNER_TEMP/fframes-studio-${{ matrix.target }}.deb" \
            --maintainer "$MAINTAINER"
      - name: Retain artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.target }}
          path: ${{ runner.temp }}/fframes-studio-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14
      - name: Retain Linux Debian candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: studio-linux-deb-${{ matrix.target }}
          path: ${{ runner.temp }}/fframes-studio-${{ matrix.target }}.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Release
    needs: [matrix]
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_release == true && always() && !cancelled() && (needs.matrix.result == 'success' || needs.matrix.result == 'failure' || (inputs.run_id != '' && inputs.run_id != null))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: A semantic version tag is required" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Validate release eligibility and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          publication = json.loads(Path("desktop/packaging/release-policy.json").read_text())["publication"]
          if not publication["consumer_release_enabled"] or not publication["trusted_release_keys_configured"]:
              raise SystemExit("Consumer release is disabled until trusted signing keys and qualification are configured.")
          PY
          eligible_targets_json="$(python3 desktop/scripts/test-qualification-m7.py --eligible-targets --verify-worktree)"
          eligible_targets="$(printf '%s' "$eligible_targets_json" | python3 -c 'import json, sys; print(" ".join(json.load(sys.stdin)))')"
          if [ -z "$eligible_targets" ]; then
            echo "No target is eligible for consumer publication." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          ledger_commit="$(python3 -c 'import json; print(json.load(open("desktop/qualification/m7-results.json"))["source"]["commit"])')"
          if [ "$tag_commit" != "$ledger_commit" ]; then
            echo "Release tag commit does not match the qualified M7 source commit." >&2
            exit 1
          fi
          if [ -n "$RUN_ID" ]; then
            run_commit="$(gh run view "$RUN_ID" -R "$REPOSITORY" --json headSha -q .headSha)"
            if [ "$run_commit" != "$tag_commit" ]; then
              echo "Reused artifact run does not match the release tag commit." >&2
              exit 1
            fi
          elif [ "$GITHUB_SHA" != "$tag_commit" ]; then
            echo "Fresh native build commit does not match the release tag." >&2
            exit 1
          fi
          echo "ELIGIBLE_TARGETS=$eligible_targets" >> "$GITHUB_ENV"

      - name: Fetch release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p raw-artifacts dist
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$RUN_ID" ]; then
            echo "Downloading artifacts from run $RUN_ID..."
            gh run download "$RUN_ID" -R "$REPOSITORY" -D raw-artifacts
          else
            echo "Downloading artifacts from current run..."
            gh run download "$GITHUB_RUN_ID" -R "$REPOSITORY" -D raw-artifacts
          fi

          echo "Extracted files in raw-artifacts:"
          find raw-artifacts -type f

          for target in $ELIGIBLE_TARGETS; do
            expected="fframes-studio-${target}.zip"
            candidate="$(find raw-artifacts -type f -name "$expected" -print -quit)"
            if [ -z "$candidate" ]; then
              echo "Missing native candidate package for eligible target $target" >&2
              exit 1
            fi
            cp "$candidate" "dist/$expected"
            python3 desktop/scripts/test-qualification-m7.py --verify-package "$target" "dist/$expected"
          done
          ls -lh dist/

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum fframes-studio-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Release Notes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          labels = {
              "aarch64-apple-darwin": "macOS Apple Silicon",
              "x86_64-pc-windows-msvc": "Windows x64",
              "x86_64-unknown-linux-gnu": "Linux x64",
          }
          packages = sorted(Path("dist").glob("fframes-studio-*.zip"))
          lines = [f"# fframes Studio {os.environ['RELEASE_TAG']}", "", "Native desktop video development studio for fframes.", "", "## Qualified downloads", ""]
          for package in packages:
              target = package.name.removeprefix("fframes-studio-").removesuffix(".zip")
              lines.append(f"- {labels[target]}: `{package.name}`")
          lines.extend(["", "## SHA-256", "", "```text", Path("dist/SHA256SUMS.txt").read_text().rstrip(), "```", ""])
          Path("release-notes.md").write_text("\n".join(lines))
          PY
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          extra_args=()
          if [ "$INPUT_PRERELEASE" = "true" ]; then
            extra_args+=("--prerelease")
          fi
          if [ "$INPUT_DRAFT" = "true" ]; then
            extra_args+=("--draft")
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; published bytes are immutable." >&2
            exit 1
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" dist/* \
              --title "fframes Studio $RELEASE_TAG" \
              --notes-file release-notes.md \
              "${extra_args[@]}"
          fi
          echo "Release successfully published: $(gh release view "$RELEASE_TAG" --json url -q .url)"
