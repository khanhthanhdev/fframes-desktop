name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      run_id:
        description: "Run ID to attach existing artifacts from (leave empty to build fresh)"
        required: false
        default: ""
      draft:
        description: "Create draft release"
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Build Native (${{ matrix.runner }})
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.run_id == '' || inputs.run_id == null))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Set native build directory
        run: |
          if command -v cygpath >/dev/null 2>&1; then
            echo "CARGO_TARGET_DIR=$(cygpath -m "$RUNNER_TEMP/studio-native")" >> "$GITHUB_ENV"
          else
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/studio-native" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: Assert native architecture
        run: |
          python3 -c 'import subprocess; assert "host: ${{ matrix.target }}" in subprocess.check_output(["rustc", "-vV"], text=True)'
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev libfontconfig1-dev libasound2-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libzstd-dev nasm
          llvm_lib="$(find /usr/lib -name "libclang.so" 2>/dev/null | head -n1)"
          if [ -n "$llvm_lib" ]; then
            echo "LIBCLANG_PATH=$(dirname "$llvm_lib")" >> "$GITHUB_ENV"
          fi
      - name: macOS native prerequisites
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install nasm || true
          xcode_dir="$(xcode-select -p 2>/dev/null || echo '/Applications/Xcode.app/Contents/Developer')"
          if [ -d "$xcode_dir/Toolchains/XcodeDefault.xctoolchain/usr/lib" ]; then
            echo "LIBCLANG_PATH=$xcode_dir/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
          fi
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure Windows MSVC toolchain precedence
        if: runner.os == 'Windows'
        run: |
          rm -f /usr/bin/link.exe /usr/bin/link
          which link
      - name: Build pinned native FFmpeg install
        if: runner.os != 'Windows'
        run: |
          python3 desktop/scripts/build-native-ffmpeg.py --source "$RUNNER_TEMP/ffmpeg-source" --out "$RUNNER_TEMP/ffmpeg-native"
          echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg-native" >> "$GITHUB_ENV"
      - name: Windows FFmpeg build dependency
        if: runner.os == 'Windows'
        run: |
          distribution=ffmpeg-n9.0-latest-win64-gpl-shared-9.0
          curl -fL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$distribution.zip" -o "$RUNNER_TEMP/ffmpeg.zip"
          7z x "$RUNNER_TEMP/ffmpeg.zip" -o"$RUNNER_TEMP/ffmpeg"
          ffmpeg_dir="$(cygpath -w "$RUNNER_TEMP/ffmpeg/$distribution")"
          echo "FFMPEG_DIR=$ffmpeg_dir" >> "$GITHUB_ENV"
          echo "$ffmpeg_dir\bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
      - name: Focused tests and lint
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --all --check
          cargo test --locked --manifest-path desktop/Cargo.toml -p studio-bootstrap -p studio-sdk -p studio-agent-spike -p fframes-studio
          cargo clippy --locked --manifest-path desktop/Cargo.toml -p studio-bootstrap -p studio-sdk -p studio-agent-spike -p fframes-studio --all-targets -- -D warnings
          cargo test --locked -p fframes-studio-protocol -p fframes-studio-runtime
          python3 desktop/scripts/test-packaging.py
          python3 desktop/scripts/validate-qualification.py desktop/qualification/m0-results.json
      - name: Build and render annotated worker
        run: |
          cargo build --release --manifest-path desktop/fixtures/annotated-video-overlay/Cargo.toml
          cd desktop/fixtures/annotated-video-overlay
          cargo run --release -- frame 0 -o "$RUNNER_TEMP/worker-frame"
      - name: Real worker frame, anchor, crash and restart
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test worker_roundtrip -- --ignored
      - name: Assemble and verify native offline SDK
        run: python3 desktop/scripts/assemble-phase-zero-sdk.py --out "$RUNNER_TEMP/studio-sdk"
      - name: Install SDK and launch managed worker
        run: SDK_BUNDLE="$RUNNER_TEMP/studio-sdk" cargo test --locked --manifest-path desktop/Cargo.toml -p fframes-studio --test managed_worker -- --ignored
      - name: Package native app and SDK artifact
        run: python3 desktop/scripts/package-phase-zero.py --out "$RUNNER_TEMP/fframes-studio-${{ matrix.target }}" --sdk-bundle "$RUNNER_TEMP/studio-sdk"
      - name: Retain artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.target }}
          path: ${{ runner.temp }}/fframes-studio-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Release
    needs: [matrix]
    if: always() && !cancelled() && (needs.matrix.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.run_id != '' && inputs.run_id != null)) && needs.matrix.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            echo "Error: No release tag provided" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Fetch release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw-artifacts dist
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.run_id }}" ]; then
            echo "Downloading artifacts from run ${{ inputs.run_id }}..."
            gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -D raw-artifacts
          else
            echo "Downloading artifacts from current run..."
            gh run download "$GITHUB_RUN_ID" -R "${{ github.repository }}" -D raw-artifacts
          fi

          echo "Extracted files in raw-artifacts:"
          find raw-artifacts -type f

          echo "Searching for target zip packages..."
          find raw-artifacts -name "fframes-studio-*.zip" -exec cp -v {} dist/ \;

          echo "Dist directory contents:"
          ls -lh dist/

          expected_targets=(
            "fframes-studio-x86_64-unknown-linux-gnu.zip"
            "fframes-studio-x86_64-pc-windows-msvc.zip"
            "fframes-studio-aarch64-apple-darwin.zip"
          )
          for expected in "${expected_targets[@]}"; do
            if [ ! -f "dist/$expected" ]; then
              echo "Error: missing expected artifact dist/$expected" >&2
              exit 1
            fi
          done

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum fframes-studio-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Release Notes
        run: |
          cat << 'EOF' > release-notes.md
          # fframes Studio RELEASE_TAG_PLACEHOLDER

          Native desktop video development studio for fframes.

          ## Downloads

          | Platform | Architecture | Package | Description |
          |:---|:---|:---|:---|
          | **Linux** | x86_64 | [`fframes-studio-x86_64-unknown-linux-gnu.zip`](https://github.com/khanhthanhdev/fframes-desktop/releases/download/RELEASE_TAG_PLACEHOLDER/fframes-studio-x86_64-unknown-linux-gnu.zip) | Standalone Linux bundle with `launch.sh` and bundled offline SDK |
          | **Windows** | x86_64 | [`fframes-studio-x86_64-pc-windows-msvc.zip`](https://github.com/khanhthanhdev/fframes-desktop/releases/download/RELEASE_TAG_PLACEHOLDER/fframes-studio-x86_64-pc-windows-msvc.zip) | Standalone Windows bundle with `launch.ps1`, FFmpeg runtime and bundled offline SDK |
          | **macOS** | Apple Silicon (arm64) | [`fframes-studio-aarch64-apple-darwin.zip`](https://github.com/khanhthanhdev/fframes-desktop/releases/download/RELEASE_TAG_PLACEHOLDER/fframes-studio-aarch64-apple-darwin.zip) | Standalone macOS bundle with `fframes Studio.app` and bundled offline SDK |

          ### Quick Start

          #### Linux (x86_64)
          ```bash
          unzip fframes-studio-x86_64-unknown-linux-gnu.zip
          cd fframes-studio-x86_64-unknown-linux-gnu
          ./launch.sh
          ```

          #### Windows (x64)
          Extract `fframes-studio-x86_64-pc-windows-msvc.zip` and run in PowerShell:
          ```powershell
          .\launch.ps1
          ```

          #### macOS (Apple Silicon)
          Extract `fframes-studio-aarch64-apple-darwin.zip`:
          Launch `fframes Studio.app` or execute `./launch.sh` in Terminal.

          ## SHA-256 Checksums

          ```text
          CHECKSUMS_PLACEHOLDER
          ```
          EOF

          sed -i "s/RELEASE_TAG_PLACEHOLDER/${RELEASE_TAG}/g" release-notes.md
          python3 -c "
          with open('release-notes.md') as f: content = f.read()
          with open('dist/SHA256SUMS.txt') as f: sums = f.read()
          content = content.replace('CHECKSUMS_PLACEHOLDER', sums.strip())
          with open('release-notes.md', 'w') as f: f.write(content)
          "
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra_args=()
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            extra_args+=("--prerelease")
          fi
          if [ "${{ inputs.draft }}" = "true" ]; then
            extra_args+=("--draft")
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists. Updating notes and uploading assets..."
            gh release edit "$RELEASE_TAG" --title "fframes Studio $RELEASE_TAG" --notes-file release-notes.md "${extra_args[@]}"
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" dist/* \
              --title "fframes Studio $RELEASE_TAG" \
              --notes-file release-notes.md \
              "${extra_args[@]}"
          fi
          echo "Release successfully published: $(gh release view "$RELEASE_TAG" --json url -q .url)"
