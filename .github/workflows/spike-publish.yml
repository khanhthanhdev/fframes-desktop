name: Spike publish primitives

# Temporary, on the throwaway spike/m1-publish branch only: runs the macOS (and, for
# comparison, Windows) prototype of the no-clobber publication primitives.
on:
  push:
    branches: [spike/m1-publish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-primitives:
    name: Publish primitives (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: desktop/spikes/publish-primitives
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
          cache: false
      - run: rustc --version && sw_vers 2>/dev/null || true
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --nocapture
